<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管控提示弹窗 · 全部维度与动作示例 - ADS</title>
<style>
:root{
  --blue:#409eff; --blue-d:#146ed5; --blue-bg:#ecf5ff; --blue-bd:#b3d8ff;
  --bg:#f5f7fa; --surface:#ffffff; --line:#e4e7ed; --bd:#dcdfe6;
  --ink:#303133; --text:#606266; --muted:#909399;
  --warn:#e6a23c; --warn-bg:#fdf6ec; --danger:#f56c6c; --danger-bg:#fef0f0;
  --success:#67c23a; --radius:6px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 Arial,"Microsoft YaHei","PingFang SC",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:#fff;color:var(--text);border-radius:4px;padding:6px 14px;min-height:32px}
button:hover{color:var(--blue);border-color:#a0cfff}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#2d8cf0;border-color:#2d8cf0;color:#fff}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* 顶部栏 */
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #ebeef5;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:var(--ink)}
.brand-badge{background:var(--blue-bg);color:var(--blue);border:1px solid #d9ecff;border-radius:4px;font-size:12px;font-weight:500;padding:2px 8px}
.top-links{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.top-links .btn-link{display:inline-flex;align-items:center;height:30px;padding:0 12px;border:1px solid var(--bd);border-radius:4px;background:#fff;color:var(--text);font-size:12px;text-decoration:none}
.top-links .btn-link:hover{border-color:var(--blue);color:var(--blue);text-decoration:none}

/* 锚点与控制条 */
.nav-strip{background:#fff;border-bottom:1px solid #ebeef5;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.nav-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:16px;background:#f4f4f5;color:var(--text);font-size:12px;border:1px solid transparent;cursor:pointer;text-decoration:none}
.nav-pill:hover{background:var(--blue-bg);color:var(--blue);text-decoration:none}
.nav-pill.active{background:var(--blue);color:#fff;font-weight:600}
.nav-pill .dim-badge{font-size:10px;padding:0 5px;border-radius:8px;background:#ffffff30}

.container{max-width:1760px;margin:0 auto;padding:18px 24px 50px;display:grid;gap:24px}

/* 交互体验控制台 */
.playground{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.playground h2{margin:0;font-size:15px;font-weight:600;margin-right:6px}
.pg-field{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text)}
.pg-field select{height:32px;border:1px solid var(--bd);border-radius:4px;padding:0 10px;color:var(--ink);background:#fff}
.pg-note{font-size:12px;color:var(--muted);margin-left:auto}

/* 分组章节 */
.scene-section{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;scroll-margin-top:76px}
.scene-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f2f5}
.scene-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scene-title h3{margin:0;font-size:16px;font-weight:600}
.scene-tag{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--blue-bg);color:var(--blue);border:1px solid #d9ecff}
.scene-tag.new{background:#e8f8f2;color:#14764c;border-color:#b8ebd6}
.scene-desc{font-size:12px;color:var(--muted)}

/* 三态平铺网格 */
.triple-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.double-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media(max-width:1420px){.triple-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:960px){.triple-grid,.double-grid{grid-template-columns:1fr}}

/* 管控弹窗卡片（与真实弹窗同构） */
.risk-card{background:#fff;border:1px solid #dcdfe6;border-radius:4px;box-shadow:0 4px 16px #00000012;display:flex;flex-direction:column;overflow:hidden}
.risk-card-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #ebeef5;background:#fff}
.risk-card-hd .hd-title{font-size:14px;font-weight:500;color:#303133;display:flex;align-items:center;gap:8px}
.risk-card-hd .hd-actions{display:flex;align-items:center;gap:8px}
.risk-card-hd .preview-btn{height:24px;min-height:24px;padding:0 8px;font-size:11px;color:var(--blue);border-color:#c6e2ff;background:#ecf5ff}
.risk-card-hd .close-x{border:0;background:none;color:#909399;padding:0 4px;min-height:24px;font-size:16px;line-height:1}
.risk-card-bd{padding:16px;font-size:12px;color:#303133;display:grid;gap:12px}
.risk-lead{font-size:13px;color:#303133;line-height:1.6}
.risk-level{font-size:13px;font-weight:500;color:var(--warn)}
.risk-level.block{color:var(--danger)}
.risk-sub{font-size:12px;color:#303133;font-weight:500;margin-top:2px}

.risk-table-wrap{overflow-x:auto;border:1px solid #dcdfe6}
.risk-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed;min-width:0}
.risk-table th,.risk-table td{border:1px solid #dcdfe6;padding:7px 6px;text-align:left;vertical-align:middle;line-height:1.5;overflow-wrap:anywhere;word-break:break-word}
.risk-table th{background:#fafafa;color:#606266;font-weight:500}
.risk-table tbody tr:hover{background:#f9fbff}
.triple-grid .risk-table{font-size:11.5px}
.triple-grid .risk-table th,.triple-grid .risk-table td{padding:6px 5px}
.obj-link{color:var(--blue);cursor:pointer;display:inline-block}
.obj-link:hover{text-decoration:underline}
.lvl-inline{display:inline-block;margin-top:2px}
.lvl-inline.warn{color:var(--warn)}
.lvl-inline.block{color:var(--danger)}
.rule-cond-sep{color:#909399;font-size:11px;margin:2px 0}
.tagmini{display:inline-block;padding:0 5px;height:18px;line-height:16px;font-size:10px;border-radius:3px;background:#fff7e6;color:#d46b08;border:1px solid #ffd591;margin-right:4px}
.tagmini.sb{background:#f9f0ff;color:#722ed1;border-color:#d3adf7}

/* 投放标准样式（参考图二） */
.t-item{display:flex;align-items:center;gap:5px;min-width:0;line-height:1.4}
.t-badge{width:16px;height:16px;flex:none;border-radius:50%;color:#fff;font-style:normal;font-size:10px;font-weight:700;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.t-badge.e{background:#f59a23}
.t-badge.p{background:#5b73a0}
.t-badge.b{background:#2f74ff}
.t-badge.t{background:#00a6e0}
.t-badge.s{background:#9b59b6}
.t-badge.a{background:#5b73a0}
.t-prod{display:flex;align-items:center;gap:6px;min-width:0}
.t-thumb{width:28px;height:28px;flex:none;border:1px solid #dcdfe6;border-radius:3px;background:#f5f7fa;display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
.t-thumb svg{width:22px;height:22px;display:block}
.t-prod-info{min-width:0;flex:1;display:grid;gap:2px}
.t-prod-title{font-size:11.5px;color:#303133;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-sub{font-size:11.5px;color:#606266;line-height:1.45}
.t-spec-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px;padding:12px 14px;background:#fafbfd;border:1px solid #ebeef5;border-radius:6px}
@media(max-width:1100px){.t-spec-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.t-spec-grid{grid-template-columns:1fr}}
.t-spec-col h4{margin:0 0 8px;font-size:12px;font-weight:600;color:#303133}
.t-spec-group{font-size:11px;color:#606266;font-weight:600;margin:8px 0 5px}
.t-spec-list{display:grid;gap:5px;font-size:11.5px}

/* 处理方式与审批备注 */
.risk-choice-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:12px;color:#303133;margin-top:2px}
.risk-choice-label{color:#606266;white-space:nowrap}
.req{color:var(--danger);margin-right:2px}
.risk-choice-row label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:#303133}
.risk-choice-row input[type=radio]{accent-color:var(--blue);margin:0}

.approval-box{display:grid;gap:6px}
.approval-box[hidden]{display:none}
.approval-label{font-size:12px;color:#606266}
.textarea-wrap{position:relative}
.textarea-wrap textarea{width:100%;height:74px;border:1px solid #dcdfe6;border-radius:4px;padding:8px 10px 20px;font-size:12px;color:#303133;resize:vertical}
.textarea-wrap textarea:focus{outline:none;border-color:var(--blue)}
.char-count{position:absolute;right:8px;bottom:6px;font-size:11px;color:#909399;pointer-events:none}
.risk-err{color:var(--danger);font-size:12px;min-height:16px}

.risk-card-ft{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 16px 14px;border-top:1px solid #f2f4f7;background:#fff}
.risk-card-ft button{height:30px;min-height:30px;padding:0 14px;font-size:12px}

/* 真实模态弹层 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
.modal-mask.on{display:flex}
.modal-box{width:min(1060px,96vw);max-height:90vh;overflow:auto;border-radius:6px;box-shadow:0 12px 40px rgba(0,0,0,.22)}
.modal-box .risk-table{min-width:780px}

/* 幅度提醒：对齐「调整预算」批量应用交互 */
.amp-diff{color:var(--danger);font-weight:600}
.amp-pct{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amp-pct.over{color:#f56c6c;background:#fef0f0;border:1px solid #fbc4c4}
.amp-pct.ok{color:#67c23a;background:#f0f9eb;border:1px solid #c2e7b0}
.amp-baseline-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 0}
.amp-baseline-bar label{font-size:12px;color:var(--ink);white-space:nowrap;margin-right:2px}
.amp-baseline-bar select,.amp-baseline-bar input{height:32px;border:1px solid var(--bd);border-radius:4px;padding:0 6px;font-size:12px;color:var(--text);background:#fff;min-width:84px}
.amp-baseline-bar input{width:82px;min-width:0;padding:0 8px}
.amp-baseline-bar [hidden]{display:none!important}
.amp-baseline-bar button.primary{height:32px;min-height:32px;padding:0 12px;font-size:12px;white-space:nowrap}
.amp-help{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.amp-input-wrap{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--bd);border-radius:4px;background:#fff;width:112px}
.amp-input-wrap:focus-within{border-color:var(--blue)}
.amp-input-wrap span{color:var(--muted);font-size:12px;flex:none}
.amp-input-wrap input{border:0;outline:none;padding:0;width:100%;min-width:0;font-size:12px;color:var(--ink);background:transparent}
.amp-empty{padding:18px 12px;text-align:center;color:var(--muted);background:#fafbfd;border:1px dashed var(--bd);border-radius:4px}

/* 广告活动复合编辑操作演练区 */
.edit-spec-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px;margin-bottom:16px;padding:12px 14px;background:#f7faff;border:1px solid #d9ecff;border-radius:6px;font-size:12px;color:#485365}
.edit-spec-fields{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;color:var(--text)}
.edit-spec-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;background:#fff;border:1px solid #dcdfe6;font-size:11.5px}
.edit-spec-chip.hit{border-color:#ffd591;background:#fffbf0;color:#ad6800}
.edit-form-banner{background:#f7faff;border:1px solid #d9ecff;border-radius:6px;padding:10px 14px;color:#485365;font-size:12.5px;line-height:1.6}
.edit-form-grid{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:center;font-size:12.5px}
@media(max-width:640px){.edit-form-grid{grid-template-columns:1fr}}
.edit-form-grid label{text-align:right;color:var(--text)}
@media(max-width:640px){.edit-form-grid label{text-align:left}}
.edit-form-grid input,.edit-form-grid select{height:32px;border:1px solid var(--bd);border-radius:4px;padding:0 10px;color:var(--ink);background:#fff}
.edit-form-grid .hint{color:var(--muted);font-size:12px;margin-left:6px}
.foot-hint{font-size:12px;color:var(--muted);margin-right:auto}

/* Toast 非模态反馈 */
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#303133;color:#fff;padding:9px 18px;border-radius:6px;font-size:13px;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.24);display:none;max-width:90vw}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span>ADS 管控提示弹窗 · 全部维度与动作示例</span>
    <span class="brand-badge">统一格式预览</span>
  </div>
  <div class="top-links">
    <a class="btn-link" href="风控规则配置-控制动作扩展.html" target="_blank">风控规则配置 ↗</a>
    <a class="btn-link" href="全部广告-预算管控提示示例.html" target="_blank">全部广告预算示例 ↗</a>
  </div>
</header>

<nav class="nav-strip" aria-label="场景快速跳转">
  <a class="nav-pill active" href="#scene-create">1. 新增（活动/广告组/商品广告）</a>
  <a class="nav-pill" href="#scene-campaign-enable">2. 广告活动 · 启用</a>
  <a class="nav-pill" href="#scene-campaign-budget">3. 广告活动 · 修改预算</a>
  <a class="nav-pill" href="#scene-campaign-placement">4. 广告活动 · 广告位比例</a>
  <a class="nav-pill" href="#scene-campaign-composite">5. 广告活动 · 编辑（复合风控）</a>
  <a class="nav-pill" href="#scene-adgroup-enable">6. 广告组 · 启用</a>
  <a class="nav-pill" href="#scene-adgroup-bid">7. 广告组 · 修改默认竞价</a>
  <a class="nav-pill" href="#scene-targeting-bid">8. 投放 · 修改竞价（新增格式）</a>
  <a class="nav-pill" href="#scene-product-enable">9. 商品/广告 · 启用</a>
  <a class="nav-pill" href="#scene-amplitude">10. 涨幅二次【风控提醒】</a>
</nav>

<main class="container">
  <section class="playground" aria-label="交互弹窗实时演练">
    <h2>交互弹窗实时试算</h2>
    <label class="pg-field">
      <span>场景维度与动作</span>
      <select id="pgScene"></select>
    </label>
    <label class="pg-field">
      <span>最高管控等级</span>
      <select id="pgLevel">
        <option value="页面提醒">页面提醒</option>
        <option value="飞书审批">飞书审批</option>
        <option value="禁止操作">禁止操作</option>
      </select>
    </label>
    <button type="button" class="primary" onclick="openPlaygroundModal()">打开交互弹窗预览</button>
    <button type="button" onclick="openCampaignEditModal()">打开「编辑广告活动」操作弹窗</button>
    <span class="pg-note">下方每个场景均支持直接在卡片内切换处理方式、输入审批备注，或点击「弹窗预览」体验真实遮罩弹窗。</span>
  </section>

  <div id="scenesRoot"></div>
</main>

<div id="modalMask" class="modal-mask" role="dialog" aria-modal="true" aria-label="管控提示交互弹窗">
  <div id="modalBox" class="modal-box"></div>
</div>
<div id="toast" role="status"></div>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3200);
}

const thumbSvg='<svg viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="2" fill="#e6f2ff"/><circle cx="8" cy="8.5" r="2" fill="#fff"/><path d="M2 19l6-6.5 4.2 4.3 3.3-3.5L22 19H2z" fill="#1890ff"/></svg>';
const tBadge=(ch,cls,text,isLink=false)=>`<div class="t-item"><i class="t-badge ${cls}">${ch}</i>${isLink?`<span class="obj-link" onclick="toast('查看投放详情：${esc(text)}')">${esc(text)}</span>`:`<span>${esc(text)}</span>`}</div>`;
const tProd=(title,ch,cls,asin)=>`<div class="t-prod"><span class="t-thumb">${thumbSvg}</span><div class="t-prod-info"><div class="t-prod-title" title="${esc(title)}">${esc(title)}</div>${tBadge(ch,cls,asin,true)}</div></div>`;
const LEVELS = ['页面提醒', '飞书审批', '禁止操作'];

// 统一弹窗场景定义（按维度 + 动作区分格式与动态文案）
const SCENES = [
  {
    id: 'scene-create',
    title: '一、新增 — 涉及新增广告活动、广告组、商品/广告',
    badge: '沿用原新增格式',
    isNewFormat: false,
    desc: '按操作对象提取 MSKU/ASIN 匹配规则；展示 5 列：MSKU/ASIN、Style、管控规则名称、管控规则、当前表现。',
    mode: 'create',
    dimension: 'MSKU/ASIN',
    actionLabel: '新增',
    leadText: () => '以下信息触发了管控规则，请确认是否继续？',
    tableTitle: '触发规则的MSKU/ASIN：',
    columns: [
      { key: 'name', label: 'MSKU/ASIN', width: '14%' },
      { key: 'style', label: 'Style', width: '14%' },
      { key: 'rule', label: '管控规则名称', width: '17%' },
      { key: 'cond', label: '管控规则', width: '31%' },
      { key: 'perf', label: '当前表现', width: '24%' }
    ],
    rows: [
      {
        name: 'msku1111',
        style: 'Style111<br>（销售负责人）',
        ruleName: 'EOL定位管控',
        cond: '店铺：amazon/US/topshoesUS<br>style定位包含EOL 且 上月Style毛利率≤2%<div class="rule-cond-sep">或</div>实际定级包含C/D 且 上月Style毛利率≤2%',
        perf: 'Style定位=EOL，上月Style毛利率=1.12%'
      },
      {
        name: 'B021011221',
        style: 'Style222<br>（销售负责人）',
        ruleName: 'EOL定位管控',
        cond: '店铺：amazon/US/topshoesUS<br>style定位包含EOL 且 上月Style毛利率≤2%<div class="rule-cond-sep">或</div>实际定级包含C/D 且 上月Style毛利率≤2%',
        perf: '实际定级=D，上月Style毛利率=1.12%'
      },
      {
        name: '广告名 222（ASIN）',
        style: 'Style111<br>（销售负责人）',
        ruleName: 'EOL定位管控',
        cond: '店铺：amazon/US/topshoesUS<br>style定位包含EOL 且 上月Style毛利率≤2%<div class="rule-cond-sep">或</div>实际定级包含C/D 且 上月Style毛利率≤2%',
        perf: 'Style定位=EOL，上月Style毛利率=1.12%'
      }
    ]
  },
  {
    id: 'scene-campaign-enable',
    title: '二、广告活动维度 — 启用广告活动',
    badge: '广告活动维度',
    isNewFormat: false,
    desc: '顶部文案动态带入维度“广告活动”与动作“启用”；6 列包含广告活动链接列。',
    mode: 'operate',
    totalCount: 5,

function buildRiskCardHtml(scene, level, uid, inModal = false) {
  const isBlock = level === '禁止操作';
  const radioName = 'decision-' + uid;
  const noteWrapId = 'note-wrap-' + uid;
  const noteId = 'note-' + uid;
  const countId = 'cnt-' + uid;
  const errId = 'err-' + uid;

  const thead = scene.columns.map(col => `<th style="width:${col.width}">${esc(col.label)}</th>`).join('');
  const tbody = scene.rows.map(r => {
    const rank = {'页面提醒': 1, '飞书审批': 2, '禁止操作': 3};
    const rowLvl = r.rowLevel && rank[r.rowLevel] <= rank[level] ? r.rowLevel : level;
    const rowIsBlock = rowLvl === '禁止操作';
    const ruleLevelHtml = `<span class="lvl-inline ${rowIsBlock ? 'block' : 'warn'}">管控等级：${rowLvl}</span>`;
    if (scene.mode === 'create') {
      return `<tr>
        <td>${r.name}</td>
        <td>${r.style}</td>
        <td>${esc(r.ruleName)}<br>${ruleLevelHtml}</td>
        <td>${r.cond}</td>
        <td>${esc(r.perf)}</td>
      </tr>`;
    }
    const parentHtml = r.adGroup
      ? `<span class="obj-link" onclick="toast('打开广告活动详情：${esc(r.campaign)}')">${esc(r.campaign)}</span><br><span class="obj-link" onclick="toast('打开广告组详情：${esc(r.adGroup)}')">${esc(r.adGroup)}</span>`
      : `<span class="obj-link" onclick="toast('打开广告活动详情：${esc(r.campaign)}')">${esc(r.campaign)}</span>`;
    return `<tr>
      <td>${r.name}</td>
      <td>${parentHtml}</td>
      <td>${r.style}</td>
      <td>${esc(r.ruleName)}<br>${ruleLevelHtml}</td>
      <td>${r.cond}</td>
      <td>${esc(r.perf)}</td>
    </tr>`;
  }).join('');

  const closeAction = inModal ? 'closeModal()' : `toast('已关闭「${esc(scene.actionLabel)} · ${level}」示例')`;
  const confirmAction = `submitRiskCard('${uid}','${esc(scene.dimension)}','${esc(scene.actionLabel)}','${level}',${inModal})`;

  return `
  <article class="risk-card" id="card-${uid}">
    <div class="risk-card-hd">
      <div class="hd-title">
        <span>管控提示</span>
        ${inModal ? '' : `<span style="font-size:11px;color:${isBlock ? 'var(--danger)' : 'var(--warn)'};background:${isBlock ? 'var(--danger-bg)' : 'var(--warn-bg)'};padding:1px 6px;border-radius:3px">${level}</span>`}
      </div>
      <div class="hd-actions">
        ${inModal ? '' : `<button type="button" class="preview-btn" onclick="openSceneModal('${scene.id}','${level}')">弹窗预览</button>`}
        <button type="button" class="close-x" aria-label="关闭" onclick="${closeAction}">×</button>
      </div>
    </div>
    <div class="risk-card-bd">
      <div class="risk-lead">${esc(scene.leadText(scene))}</div>
      <div class="risk-level ${isBlock ? 'block' : ''}">管控等级：${level}</div>
      <div class="risk-sub">${esc(scene.tableTitle)}</div>
      <div class="risk-table-wrap">
        <table class="risk-table">
          <thead><tr>${thead}</tr></thead>
          <tbody>${tbody}</tbody>
        </table>
      </div>
      <div class="risk-choice-row">
        <span class="risk-choice-label"><span class="req">*</span>处理方式：</span>
        <label><input type="radio" name="${radioName}" value="exclude" checked onchange="toggleRiskChoice('${uid}','${level}')">排除掉风控部分，其他继续提交</label>
        ${isBlock ? '' : `<label><input type="radio" name="${radioName}" value="all" onchange="toggleRiskChoice('${uid}','${level}')">全部继续提交</label>`}

        <div class="textarea-wrap">
          <textarea id="${noteId}" maxlength="1000" placeholder="请输入审批备注" oninput="updateNoteCount('${uid}')"></textarea>

    <div class="risk-card-ft">
      ${isBlock && scene.mode === 'create'
        ? `<button type="button" class="primary" onclick="${closeAction}">关闭</button>`
        : `<button type="button" onclick="${closeAction}">取消</button><button type="button" class="primary" onclick="${confirmAction}">确定</button>`}
    </div>
  </article>`;
}

function toggleRiskChoice(uid, level) {
  const val = document.querySelector(`input[name="decision-${uid}"]:checked`)?.value;
  const wrap = document.getElementById('note-wrap-' + uid);
  const err = document.getElementById('err-' + uid);
  if (err) err.textContent = '';
  if (wrap) wrap.hidden = !(level === '飞书审批' && val === 'all');
}

function updateNoteCount(uid) {
  const ta = document.getElementById('note-' + uid);
  const cnt = document.getElementById('cnt-' + uid);
  if (ta && cnt) cnt.textContent = ta.value.length + '/1000';
}

function submitRiskCard(uid, dimension, actionLabel, level, inModal) {
  const val = document.querySelector(`input[name="decision-${uid}"]:checked`)?.value || 'exclude';
  const err = document.getElementById('err-' + uid);
  if (level === '飞书审批' && val === 'all') {
    const note = (document.getElementById('note-' + uid)?.value || '').trim();
    if (!note) {
      if (err) err.textContent = '请填写审批备注';
      toast('请填写审批备注');
      return;
    }
    if (err) err.textContent = '';
    if (inModal) closeModal();
    toast(`【${dimension} · ${actionLabel}】已发起飞书审批（全部继续提交），审批通过后生效`);
    return;
  }
  if (err) err.textContent = '';
  if (inModal) closeModal();
  toast(val === 'exclude'
    ? `【${dimension} · ${actionLabel}】已排除命中风控对象，未命中部分已继续提交（演示）`
    : `【${dimension} · ${actionLabel}】页面提醒确认后已全部继续提交（演示）`);
}

let AMP_STATE = Object.fromEntries(
  Object.entries(AMP_FIXTURES).map(([k, v]) => [k, { ...structuredClone(v), basis: 'current', op: 'increasePercent', amount: '', cap: '' }])
);

function ampPct(row) {
  if (!row.before || !Number.isFinite(row.after)) return 0;
  return (row.after - row.before) / row.before * 100;
}
function isAmpOver(row, thresholdPct) {
  return ampPct(row) > thresholdPct + 1e-6;
}
function formatAmpPctMeta(row, thresholdPct) {
  if (!row.before || !Number.isFinite(row.after)) return { text: '--', over: false };
  const pct = ampPct(row);
  const over = pct > thresholdPct + 1e-6;
  return { text: `${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%`, over };
}
function formatAmpPctHtml(row, thresholdPct, kind, idx) {
  const { text, over } = formatAmpPctMeta(row, thresholdPct);
  return `<span class="amp-pct ${over ? 'over' : 'ok'}" data-amp-pct="${kind}-${idx}">${text}</span>`;
}

            ${st.rows.map((r, i) => `<tr>
              <td>${r.labelHtml}</td>
              <td>$${r.before.toFixed(2)}${st.unitSuffix}</td>
              <td><span class="amp-input-wrap"><span>$</span><input type="number" min="${st.minVal}" step="0.01" aria-label="修改后${st.noun} ${i + 1}" value="${Number.isFinite(r.after) ? r.after.toFixed(2) : ''}" oninput="updateAmpRow('${kind}',${i},this.value)"></span></td>
              <td>${formatAmpPctHtml(r, st.thresholdPct, kind, i)}</td>
              <td><span class="obj-link" onclick="removeAmpRow('${kind}',${i},${inModal})">移除</span></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p class="amp-help">${st.noun}调整四舍五入精确到小数点后两位数；${st.noun}调整后低于亚马逊规定的最小值时，系统默认将${st.noun}设为最小值</p>`;
  }

  return `
    <article class="risk-card">
      <div class="risk-card-hd">
        <div class="hd-title"><span>风控提醒</span></div>
        <div class="hd-actions">
          ${inModal ? '' : `<button type="button" class="preview-btn" onclick="openAmplitudeModal('${kind}')">弹窗预览</button>`}
          <button type="button" class="close-x" aria-label="关闭" onclick="${closeFn}">×</button>
        </div>
      </div>
      <div class="risk-card-bd">${bodyHtml}</div>
      <div class="risk-card-ft">
        <button type="button" onclick="${closeFn}">取消</button>
        <button type="button" ${!st.rows.length ? 'disabled' : ''} onclick="removeAmpAll('${kind}',${inModal})">移除超出部分并继续</button>
        <button type="button" class="primary" ${!st.rows.length ? 'disabled' : ''} onclick="confirmAmpSubmit('${kind}',${inModal})">继续</button>
      </div>
    </article>`;
}

function refreshAmplitudeHost(kind, inModal) {
  const cardHost = document.getElementById('amp-card-host-' + kind);
  if (cardHost) cardHost.innerHTML = buildAmplitudeCardHtml(kind, false);
  if (inModal) document.getElementById('modalBox').innerHTML = buildAmplitudeCardHtml(kind, true);
}

function updateAmpRow(kind, idx, rawVal) {
  const st = AMP_STATE[kind];
  const r = st.rows[idx];
  if (!r) return;
  const val = Number(rawVal);
  r.after = rawVal.trim() === '' || !Number.isFinite(val) ? NaN : val;
  const { text, over } = formatAmpPctMeta(r, st.thresholdPct);
  document.querySelectorAll(`[data-amp-pct="${kind}-${idx}"]`).forEach(el => {
    el.textContent = text;
    el.className = `amp-pct ${over ? 'over' : 'ok'}`;
  });
}

function changeAmpBasis(kind, basis, inModal) {
  AMP_STATE[kind].basis = basis;
  refreshAmplitudeHost(kind, inModal);
}

function applyAmpBatch(kind, inModal) {
  const st = AMP_STATE[kind];
  const amt = Number(st.amount);
  const cap = st.cap === '' ? Infinity : Number(st.cap);
  if (st.basis === 'custom') {
    if (st.amount === '' || !Number.isFinite(amt) || amt <= 0) {
      toast(`请输入大于 0 的自定义${st.noun}`);
      return;
    }
    const fixed = Math.max(st.minVal, Math.round((amt + Number.EPSILON) * 100) / 100);
    st.rows.forEach(r => { r.after = fixed; });
  } else {
    if (st.amount === '' || !Number.isFinite(amt) || amt < 0) {
      toast('请输入有效的调整幅度');
      return;
    }
    if (st.op === 'decreasePercent' && amt > 100) {
      toast('降低比例不能超过 100%');
      return;
    }
    if (st.cap !== '' && (!Number.isFinite(cap) || cap < st.minVal)) {
      toast(`调整上限不能低于 $${st.minVal.toFixed(2)}`);
      return;
    }
    st.rows.forEach(r => {
      const base = st.basis === 'modified' ? (Number.isFinite(r.after) ? r.after : r.before) : r.before;
      const delta = st.op.endsWith('Percent') ? base * amt / 100 : amt;
      const rawNext = st.op.startsWith('increase') ? base + delta : base - delta;
      r.after = Math.max(st.minVal, Math.round((Math.min(rawNext, cap) + Number.EPSILON) * 100) / 100);
    });
  }
  refreshAmplitudeHost(kind, inModal);
  toast(`已更新 ${st.rows.length} 项${st.noun}预览`);
}

function removeAmpRow(kind, idx, inModal) {
  AMP_STATE[kind].rows.splice(idx, 1);
  refreshAmplitudeHost(kind, inModal);
  toast('已移除该调整项');
}

function removeAmpAll(kind, inModal) {
  const st = AMP_STATE[kind];
  const overCount = st.rows.filter(r => isAmpOver(r, st.thresholdPct)).length;
  st.rows = st.rows.filter(r => !isAmpOver(r, st.thresholdPct));
  if (inModal) closeModal();
  else refreshAmplitudeHost(kind, false);
  toast(overCount
    ? `已移除 ${overCount} 项超出 +${st.thresholdPct}% 的${st.noun}，其余正常项已继续提交（演示）`
    : `当前无超出 +${st.thresholdPct}% 的${st.noun}项，已全部继续提交（演示）`);
}

function resetAmpState(kind, inModal) {
  AMP_STATE[kind] = { ...structuredClone(AMP_FIXTURES[kind]), basis: 'current', op: 'increasePercent', amount: '', cap: '' };
  refreshAmplitudeHost(kind, inModal);
}

function confirmAmpSubmit(kind, inModal) {
  const st = AMP_STATE[kind];
  if (st.rows.some(r => !Number.isFinite(r.after) || r.after < st.minVal)) {
    toast(`请确保所有修改后${st.noun}不低于 $${st.minVal.toFixed(2)}`);
    return;
  }
  if (inModal) closeModal();
  const overCount = st.rows.filter(r => isAmpOver(r, st.thresholdPct)).length;
  toast(overCount
    ? `已确认继续提交 ${st.rows.length} 项${st.noun}修改（演示）`
    : `已按调整后的数值提交 ${st.rows.length} 项${st.noun}修改（演示）`);
}

const COMP_EDIT_DEFAULT = {

  document.getElementById('modalBox').innerHTML = `
    <article class="risk-card" style="max-width:780px;margin:0 auto">

function submitCampaignEditModal() {
  const c = compEditState;
  const v = Number(document.getElementById('ceStatus').value);
  const budget = Number(document.getElementById('ceBudget').value);
  const top = Number(document.getElementById('ceTop').value);
  const prod = Number(document.getElementById('ceProd').value);
  const end = document.getElementById('ceEnd').value || c.before.end;
  const riskMode = document.getElementById('ceRiskMode').value || 'mixed';
  const errEl = document.getElementById('ceError');

  if (!Number.isFinite(budget) || budget <= 0) {
    errEl.textContent = '请输入大于0的有效预算';
    return;
  }
  if (!Number.isInteger(top) || top < 0 || top > 900 || !Number.isInteger(prod) || prod < 0 || prod > 900) {
    errEl.textContent = '广告位比例请输入0-900的整数';
    return;
  }
  c.after = { v, budget, top, prod, end };
  c.riskMode = riskMode;

  const changesCount =
    (v !== c.before.v ? 1 : 0) +
    (budget !== c.before.budget ? 1 : 0) +
    (top !== c.before.top ? 1 : 0) +
    (prod !== c.before.prod ? 1 : 0) +
    (end !== c.before.end ? 1 : 0);

  if (!changesCount) {
    closeModal();
    toast('未修改任何字段');
    return;
  }

  const pickLevel = def => (riskMode === 'mixed' ? def : riskMode);
  const hits = [];
  if (v === 1 && c.before.v === 0) {
    hits.push({
      key: 'enable',
      action: '开启广告活动/广告组/商品&广告',
      triggerText: '开启广告活动（暂停 → 启用）',
      rule: '定级不达标开启管控',
      level: pickLevel('禁止操作'),
      cond: '实际定级小于目标定级：是',
      perf: '实际定级=C，目标定级=A'
    });
  }
  if (budget > c.before.budget) {
    hits.push({
      key: 'budget',
      action: '提高广告活动预算/基准预算',
      triggerText: `提高预算（$${c.before.budget.toFixed(2)} → $${budget.toFixed(2)}）`,
      rule: '高ACOS预算管控',
      level: pickLevel('飞书审批'),
      cond: '近7天广告活动ACOS >= 45%',
      perf: '近7天广告活动ACOS = 52.30%'
    });
  }
  if (top > c.before.top) {
    hits.push({
      key: 'top',
      action: '提高广告位竞价比例',
      triggerText: `提高广告位比例 - 搜索结果顶部（首页）（${c.before.top}% → ${top}%）`,
      rule: '低转化控顶位比例',
      level: pickLevel('页面提醒'),
      cond: '近14天Style广告转化率 =< 5%',
      perf: '近14天Style广告转化率 = 3.80%'
    });
  }

  c.hits = hits;
  c.changesCount = changesCount;
  if (!hits.length) {
    applyCampaignEditFinal(false, false);
    return;
  }
  renderCampaignEditRiskModal();
}

function renderCampaignEditRiskModal() {
  const c = compEditState;
  const hits = c.hits;
  const rank = { '页面提醒': 1, '飞书审批': 2, '禁止操作': 3 };
  const maxLevel = hits.reduce((a, h) => (rank[h.level] > rank[a] ? h.level : a), '页面提醒');
  c.maxLevel = maxLevel;
  const isBlock = maxLevel === '禁止操作';

  const tbody = hits.map(h => `<tr>
    <td><span class="tagmini">${esc(c.type)}</span>${esc(c.campaign)}<br><span style="color:#606266">触发项：${esc(h.triggerText)}</span></td>
    <td><span class="obj-link" onclick="toast('打开广告活动详情：${esc(c.campaign)}')">${esc(c.campaign)}</span></td>
    <td>${esc(c.style)}<br>（${esc(c.owner)}）</td>
    <td>${esc(h.rule)}<br><span class="lvl-inline ${h.level === '禁止操作' ? 'block' : 'warn'}">管控等级：${esc(h.level)}</span></td>
    <td>店铺：amazon/US/topshoesUS<br>控制动作：${esc(h.action)}<br>${esc(h.cond)}</td>
    <td>${esc(h.perf)}</td>
  </tr>`).join('');

  document.getElementById('modalBox').innerHTML = `
    <article class="risk-card">
      <div class="risk-card-hd">
        <div class="hd-title"><span>管控提示</span></div>
        <button type="button" class="close-x" aria-label="关闭" onclick="closeModal()">×</button>
      </div>
      <div class="risk-card-bd">
        <div class="risk-lead">本次编辑广告活动共修改 ${c.changesCount} 项，其中 ${hits.length} 项修改触发了管控规则，请确认是否继续？</div>
        <div class="risk-level ${isBlock ? 'block' : ''}">管控等级：${esc(maxLevel)}</div>
        <div class="risk-sub">触发规则的广告活动修改项：</div>
        <div class="risk-table-wrap">
          <table class="risk-table">
            <thead>
              <tr>
                <th style="width:19%">名称</th>
                <th style="width:14%">广告活动/广告组</th>
                <th style="width:12%">Style</th>
                <th style="width:14%">管控规则名称</th>
                <th style="width:23%">管控规则</th>
                <th style="width:18%">当前表现</th>
              </tr>
            </thead>
            <tbody>${tbody}</tbody>
          </table>
        </div>
        <div class="risk-choice-row">
          <span class="risk-choice-label"><span class="req">*</span>处理方式：</span>
          <label><input type="radio" name="ceDecision" value="exclude" checked onchange="toggleCampaignEditDecision()">排除掉风控部分，其他继续提交</label>
          ${isBlock ? '' : '<label><input type="radio" name="ceDecision" value="all" onchange="toggleCampaignEditDecision()">全部继续提交</label>'}
        </div>
        <div id="ceApprovalBox" class="approval-box" hidden>
          <div class="approval-label"><span class="req">*</span>审批备注：</div>
          <div class="textarea-wrap">
            <textarea id="ceApprovalNote" maxlength="1000" placeholder="请输入审批备注" oninput="document.getElementById('ceNoteCnt').textContent=this.value.length+'/1000'"></textarea>
            <span class="char-count" id="ceNoteCnt">0/1000</span>
          </div>
        </div>
        <div class="risk-err" id="ceRiskErr" role="status"></div>
      </div>
      <div class="risk-card-ft">
        <span class="foot-hint" id="ceFootHint">回退表中命中的修改项，其余未命中修改继续保存</span>
        <button type="button" onclick="openCampaignEditModal(false)">返回修改</button>
        <button type="button" class="primary" onclick="confirmCampaignEditRisk()">确定</button>
      </div>
    </article>`;
  document.getElementById('modalMask').classList.add('on');
}

function toggleCampaignEditDecision() {
  const all = document.querySelector('input[name="ceDecision"]:checked')?.value === 'all';
  const approval = compEditState.maxLevel === '飞书审批' && all;
  const box = document.getElementById('ceApprovalBox');
  const hint = document.getElementById('ceFootHint');
  const err = document.getElementById('ceRiskErr');
  if (box) box.hidden = !approval;
  if (hint) {
    hint.textContent = approval
      ? '确定后将合并生成 1 张「编辑广告活动」飞书审批单，审批通过后生效'
      : all
        ? '确定后全部修改项将直接提交'
        : '回退表中命中的修改项，其余未命中修改继续保存';
  }
  if (err) err.textContent = '';
}

function confirmCampaignEditRisk() {
  const all = document.querySelector('input[name="ceDecision"]:checked')?.value === 'all';
  if (all && compEditState.maxLevel === '飞书审批') {
    const note = (document.getElementById('ceApprovalNote')?.value || '').trim();
    if (!note) {
      const err = document.getElementById('ceRiskErr');
      if (err) err.textContent = '请填写审批备注';
      toast('请填写审批备注');
      return;
    }
    applyCampaignEditFinal(false, true);
    return;
  }
  applyCampaignEditFinal(!all, false);
}

function applyCampaignEditFinal(excludeHits, isApproval) {
  const c = compEditState;
  const hitKeys = new Set(c.hits.map(h => h.key));
  if (isApproval) {
    closeModal();
    toast(`已合并发起 1 张「编辑广告活动」飞书审批单（含 ${c.hits.length} 项受控修改），审批通过后生效（演示）`);
    return;
  }
  const finalV = excludeHits && hitKeys.has('enable') ? c.before.v : c.after.v;
  const finalBudget = excludeHits && hitKeys.has('budget') ? c.before.budget : c.after.budget;
  const finalTop = excludeHits && hitKeys.has('top') ? c.before.top : c.after.top;
  const kept = [];
  if (finalV !== c.before.v) kept.push('活动状态启用');
  if (finalBudget !== c.before.budget) kept.push(`预算 $${finalBudget.toFixed(2)}`);
  if (finalTop !== c.before.top) kept.push(`搜索结果顶部 ${finalTop}%`);
  if (c.after.prod !== c.before.prod) kept.push(`商品页面 ${c.after.prod}%`);
  if (c.after.end !== c.before.end) kept.push(`结束日期 ${c.after.end}`);

  const rolledBack = excludeHits ? c.hits.map(h => h.triggerText) : [];
  closeModal();
  if (!kept.length) {
    toast('已排除全部风控修改项，无可提交的修改内容（演示）');
    return;
  }
  toast(
    excludeHits
      ? `已回退 ${rolledBack.length} 项命中修改，其余已保存：${kept.join('、')}`
      : `广告活动编辑已全部保存：${kept.join('、')}`
  );
}

document.getElementById('modalMask').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

function setActiveNavById(sectionId) {
  document.querySelectorAll('.nav-pill').forEach(a => {
    a.classList.toggle('active', a.getAttribute('href') === '#' + sectionId);
  });
}

document.querySelectorAll('.nav-pill').forEach(a => {
  a.addEventListener('click', () => {
    const id = (a.getAttribute('href') || '').replace(/^#/, '');
    setActiveNavById(id);
    const sel = document.getElementById('pgScene');
    if (sel && SCENES.some(s => s.id === id)) sel.value = id;
  });
});

renderAllScenes();

if ('IntersectionObserver' in window) {
  const observer = new IntersectionObserver(entries => {
    const visible = entries.filter(e => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio);
    if (visible.length) setActiveNavById(visible[0].target.id);
  }, { rootMargin: '-90px 0px -55% 0px', threshold: [0.1, 0.35] });
  document.querySelectorAll('.scene-section').forEach(sec => observer.observe(sec));
}
