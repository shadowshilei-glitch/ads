<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风控配置 · ADS</title><style>:root {
  --ads-font: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
  --ads-title: 17px;
  --ads-body: 15px;
  --ads-control: 14px;
  --ads-meta: 13px;
  --ads-blue: #4099ff;
  --ads-blue-dark: #146ed5;
  --ads-blue-soft: #edf5ff;
  --ads-bg: #f6f8fb;
  --ads-surface: #fff;
  --ads-line: #e1e7ef;
  --ads-ink: #172a42;
  --ads-text: #34465c;
  --ads-muted: #586a81;
  --ads-danger: #b52b40;
  --ads-success: #14764c;
  --ads-radius: 12px;
}
.ads-ui { color: var(--ads-ink); font: var(--ads-body)/1.6 var(--ads-font); }
.ads-ui *, .ads-ui *::before, .ads-ui *::after { box-sizing: border-box; }
.ads-ui [hidden] { display: none !important; }
.ads-ui :is(button,input,select,textarea) { font: inherit; font-size: var(--ads-control); }
.ads-ui :focus-visible { outline: 2px solid var(--ads-blue-dark); outline-offset: 2px; }
.ads-ui a { color: var(--ads-blue-dark); }
.ads-button, .ads-input {
  min-height: 38px; border: 1px solid #ced9e6; border-radius: 8px;
  background: var(--ads-surface); color: var(--ads-text); padding: 7px 13px;
}
.ads-input { max-width: 100%; min-width: 0; }
.ads-input[type="number"] { width: 88px; }
.ads-input::file-selector-button {
  margin-inline-end: 8px; padding: 2px 8px; border: 1px solid var(--ads-line);
  border-radius: 5px; background: var(--ads-blue-soft); color: var(--ads-blue-dark);
  font: inherit; font-weight: 600; cursor: pointer;
}
.ads-button { cursor: pointer; white-space: nowrap; font-weight: 600; }
.ads-button:hover:not(:disabled) { color: var(--ads-blue-dark); border-color: var(--ads-blue); }
.ads-button:disabled { opacity: .5; cursor: default; }
.ads-button[data-tone="primary"] { color: white; border-color: var(--ads-blue-dark); background: var(--ads-blue-dark); }
.ads-button[data-tone="primary"]:hover:not(:disabled) { color: white; background: #0e59b0; }
.ads-button[data-tone="danger"] { color: var(--ads-danger); }
.ads-button[data-tone="danger"]:hover:not(:disabled) { color: var(--ads-danger); border-color: #ebadb7; background: #fff5f6; }
.ads-field { display: grid; gap: 6px; align-content: start; }
.ads-field > span, .ads-meta { font-size: var(--ads-meta); color: var(--ads-muted); }
.ads-field > span { color: var(--ads-text); font-weight: 600; }
.ads-ui input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--ads-blue-dark); }
.ads-inline, .ads-toolbar, .ads-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.ads-filter { align-items: end; }
.ads-toolbar { justify-content: space-between; }
.ads-stack { display: grid; gap: 14px; min-width: 0; }
.ads-tag { display: inline-flex; width: fit-content; border-radius: 6px; padding: 2px 8px; font-size: var(--ads-meta); color: var(--ads-text); background: var(--ads-bg); }
.ads-tag[data-tone="success"] { color: var(--ads-success); background: #eaf8f0; }
.ads-tag[data-tone="danger"] { color: var(--ads-danger); background: #fff0f2; }
.ads-tag[data-tone="info"] { color: var(--ads-blue-dark); background: var(--ads-blue-soft); }
.ads-panel { min-width: 0; padding: clamp(15px, 2vw, 22px); background: var(--ads-surface); border: 1px solid var(--ads-line); border-radius: var(--ads-radius); }
.ads-panel h3 { margin: 0; font-size: var(--ads-title); font-weight: 700; line-height: 1.45; }
.ads-panel .ads-panel { padding: 14px; background: #f9fbfd; }
.ads-feedback { padding: 9px 12px; border-radius: 8px; background: #f1f5fa; color: var(--ads-text); }
.ads-feedback[data-tone="danger"] { background: #fff0f2; color: var(--ads-danger); }
.ads-feedback[data-tone="success"] { background: #eaf8f0; color: var(--ads-success); }
.ads-tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--ads-line); }
.ads-tabs button { color: var(--ads-text); background: white; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; cursor: pointer; }
.ads-tabs button[aria-pressed="true"] { color: var(--ads-blue-dark); border-bottom-color: var(--ads-blue); font-weight: 600; }
.ads-table-wrap { overflow: auto; }
.ads-table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: var(--ads-control); }
.ads-table th, .ads-table td { padding: 10px 12px; text-align: start; border-bottom: 1px solid var(--ads-line); }
.ads-table th { background: #f2f6fa; color: var(--ads-text); font-weight: 600; }
.ads-table th button { background: transparent; border: 0; padding: 0; color: inherit; cursor: pointer; font-weight: 600; }
.ads-table tbody tr:hover { background: #f7faff; }
.ads-num { font-variant-numeric: tabular-nums; }
.ads-dialog {
  width: min(620px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
  padding: 0; border: 1px solid var(--ads-line); border-radius: var(--ads-radius);
  color: var(--ads-ink); box-shadow: 0 12px 42px #24324630;
}
.ads-dialog::backdrop { background: #24324650; }
.ads-dialog[data-drawer] { margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; max-width: 100%; border-radius: 0; }
.ads-dialog-header, .ads-dialog-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; }
.ads-dialog-header { border-bottom: 1px solid var(--ads-line); font-weight: 600; font-size: var(--ads-title); }
.ads-dialog-footer { border-top: 1px solid var(--ads-line); justify-content: flex-end; }
.ads-dialog-body { padding: 16px; }
.ads-dual { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ads-dual h4 { margin: 0; }
.ads-options { max-height: 216px; overflow: auto; }
.ads-choice { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--ads-line); }
.ads-choice span { overflow-wrap: anywhere; }
.ads-choice label { display: inline-flex; align-items: center; gap: 6px; }
.ads-metrics { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 8px; }
.ads-metric strong { display: block; font-size: 24px; font-weight: 700; }
.ads-bars { display: grid; gap: 7px; }
.ads-bar { display: grid; grid-template-columns: 70px minmax(70px,1fr) 55px; align-items: center; gap: 8px; font-size: var(--ads-meta); }
.ads-bar meter { width: 100%; }
.ads-step-list { display: flex; flex-wrap: wrap; gap: 6px 10px; padding-inline-start: 0; margin: 0; list-style: none; color: var(--ads-muted); font-size: var(--ads-meta); counter-reset: ads-step; }
.ads-step-list li { display: inline-flex; gap: 6px; align-items: center; padding: 4px 7px; border-radius: 6px; counter-increment: ads-step; }
.ads-step-list li::before { content: counter(ads-step); width: 19px; height: 19px; display: grid; place-items: center; border-radius: 50%; background: #eaf0f6; font-size: 11px; }
.ads-step-list [aria-current="step"] { color: var(--ads-blue-dark); background: var(--ads-blue-soft); font-weight: 700; }
.ads-step-list [aria-current="step"]::before { color: white; background: var(--ads-blue-dark); }
@media (max-width: 560px) { .ads-dual { grid-template-columns: 1fr; } }

.ads-trend-chart { display: block; width: 100%; max-height: 245px; }
.ads-trend-chart line { stroke: var(--ads-line); }
.ads-trend-chart text { font: 13px var(--ads-font); fill: var(--ads-muted); }
.ads-trend-chart polyline { stroke: var(--ads-blue-dark); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.ads-trend-chart circle { fill: white; stroke: var(--ads-blue-dark); stroke-width: 2; cursor: pointer; }
.ads-trend-chart circle.is-active { fill: var(--ads-blue-dark); }
.ads-trend-summary { font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) {
  .ads-trend-chart text { font-size: 20px; }
}

'Style广告销量占比':{type:'metric',unit:'%',windows},'Style广销比':{type:'metric',unit:'%',windows},'Style转化率':{type:'metric',unit:'%',windows,hint:'总订单量 ÷ Session × 100%，不是广告订单量 ÷ 点击量。'},'Style利润率（不含货损赔偿）':{type:'metric',unit:'%',windows:profitWindows,hint:'取周损益；允许负数，周期不包含当前周／月。'},
'Style广告点击率':{type:'metric',unit:'%',windows,added:true,ops:['>=','=<','介于']},'Style广告转化率':{type:'metric',unit:'%',windows,added:true,ops:['>=','=<','介于']},'StyleROAS':{type:'metric',unit:'',windows,added:true,ops:['>=','=<','介于']},'StyleACOS':{type:'metric',unit:'%',windows,added:true,ops:['>=','=<','介于']},'Style点击成本':{type:'metric',unit:'',windows,added:true,ops:['>=','=<','介于']},'Style转化成本':{type:'metric',unit:'',windows,added:true,ops:['>=','=<','介于']},'连续亏损周数':{type:'number',unit:'周',added:true,ops:['>=','=<','介于'],min:1,max:20,integer:true},'实际定级大于目标定级':{type:'single',values:['是','否'],added:true,formula:'仅比较S/A/B/C/D/D-/EOL共7个等级（S>A>B>C>D>D->EOL），为空或不属于上述7个等级时默认不命中'},'实际定级小于目标定级':{type:'single',values:['是','否'],added:true,formula:'仅比较S/A/B/C/D/D-/EOL共7个等级（S>A>B>C>D>D->EOL），为空或不属于上述7个等级时默认不命中'},'广告活动ROAS':{type:'metric',unit:'',windows,added:true,ops:['>=','=<','介于']},'广告活动ACOS':{type:'metric',unit:'%',windows,added:true,ops:['>=','=<','介于']},'广告活动点击率':{type:'metric',unit:'%',windows,added:true,ops:['>=','=<','介于']},'广告活动转化率':{type:'metric',unit:'%',windows,added:true,ops:['>=','=<','介于']},'广告活动点击成本':{type:'metric',unit:'',windows,added:true,ops:['>=','=<','介于']},'广告活动转化成本':{type:'metric',unit:'',windows,added:true,ops:['>=','=<','介于']}
};
const seed=[{id:1,name:'DPF-US-广销比预警',level:'页面提醒',shops:'US/topshoesUS',actions:oldActions,enabled:true,groups:[[{field:'Style广销比',op:'≥',window:'近14天',value:'8'},{field:'CT',op:'包含',value:'Dream Pairs Flats & Pumps'}]]},{id:2,name:'广销比超线限制增投（新增示例）',level:'飞书审批',shops:'US/topshoesUS',actions:['提高广告活动预算/基准预算','提高默认竞价/投放竞价/基准竞价'],enabled:true,groups:[[{field:'Style广销比',op:'>',window:'近14天',value:'5.5'}]]},{id:3,name:'EOL产品增投限制（新增示例）',level:'禁止操作',shops:'US/topshoesUS',actions:[...oldActions,'提高广告活动预算/基准预算','提高默认竞价/投放竞价/基准竞价'],enabled:false,groups:[[{field:'实际定级',op:'包含',value:'EOL'}]]}];
let rules;try{rules=JSON.parse(localStorage.getItem('ads-risk-action-prototype-v1'))||seed}catch{rules=seed}let logs=[],draft=null,editing=null,readonly=false;

function conditionText(c){const f=fields[c.field]||{};if(c.field==='定级关系')return c.op;if(f.type==='single')return c.field+'：'+(c.value||'是');if(c.op==='介于')return (c.window||'')+c.field+'介于'+c.value+'～'+c.max+(f.unit||'');return (c.window||'')+c.field+c.op+c.value+(f.unit||'')}
function summary(r){return r.groups.map(g=>g.map(conditionText).join(' 且 ')).join(' 或 ')||'全部Style'}
function persist(){localStorage.setItem('ads-risk-action-prototype-v1',JSON.stringify(rules))}
function render(){let list=rules.filter(r=>r.name.includes($('query').value)&&(!$('status').value||$('status').value===(r.enabled?'进行中':'已暂停'))&&(!$('actionFilter').value||r.actions.includes($('actionFilter').value))&&r.shops.includes($('shopFilter').value));$('rows').innerHTML=list.map(r=>`<tr><td><input class="pick" type="checkbox" value="${r.id}"></td><td><button aria-label="切换规则状态" class="switch ${r.enabled?'':'off'}" onclick="toggle(${r.id})"></button></td><td style="min-width:210px">${esc(r.name)}</td><td class="actions">${r.actions.map(a=>`<span class="tag">${esc(a)}</span>`).join('')}</td><td>${esc(r.level)}</td><td>${esc(r.shops)}</td><td class="rule">${esc(summary(r))}${r.start?'<br><span class="muted">'+esc(r.start+' 至 '+r.end)+'</span>':''}</td><td>Dylan.Shi<br><span class="muted">${esc(r.updated||'演示配置')}</span></td><td style="min-width:160px"><button class="link" onclick="openRule(${r.id})">编辑</button><button class="link" onclick="openRule(${r.id},true)">复制</button><button class="link" onclick="openRule(${r.id},false,true)">查看</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">暂无匹配规则</td></tr>';$('count').textContent=`共 ${list.length} 条`}
function resetFilter(){['query','status','actionFilter','shopFilter'].forEach(id=>$(id).value='');render()}
function toggle(id){let r=rules.find(x=>x.id===id);r.enabled=!r.enabled;logs.unshift(`${r.enabled?'开启':'暂停'}：${r.name}`);persist();render()}
function batchStatus(){let ids=[...document.querySelectorAll('.pick:checked')].map(x=>Number(x.value));if(!ids.length)return notice('提示','请先勾选规则');let on=!rules.filter(r=>ids.includes(r.id)).every(r=>r.enabled);if(!confirm('确定'+(on?'开启':'暂停')+'所选规则？'))return;rules.filter(r=>ids.includes(r.id)).forEach(r=>{r.enabled=on;logs.unshift(`${on?'开启':'暂停'}：${r.name}`)});persist();render()}
function openRule(id,copy=false,view=false){editing=copy?null:id;readonly=view;draft=id?structuredClone(rules.find(r=>r.id===id)):{name:'',level:'页面提醒',shops:'',actions:[],groups:[[{field:'Style广销比',op:'≥',window:'近14天',value:''}]],enabled:true,start:'',end:'',timezone:'站点当地时间',source:'全部来源'};if(copy)draft.name+='-复制';$('editorTitle').textContent=view?'查看管控规则':copy?'复制管控规则':id?'编辑管控规则':'新增管控规则';$('overlay').style.display='block';$('saveButton').style.display=view?'none':'';$('error').textContent='';editor()}
function editor(){let body=`<div class="section"><h3>基础信息</h3><div class="inner formgrid"><label class="label required">名称</label><input class="wide" id="ruleName" value="${esc(draft.name)}" placeholder="请输入规则名称" oninput="draft.name=this.value"><label class="label required">控制动作</label><div>${Object.entries(actionGroups).map(([g,arr])=>`<div class="actiongroup"><span>${g}</span><div class="checks">${arr.map(a=>`<label><input type="checkbox" ${draft.actions.includes(a)?'checked':''} onchange="changeAction('${a}',this.checked)">${a}</label>`).join('')}</div></div>`).join('')}<div class="hint">至少选择一项；勾选的动作共用本条规则的条件与控制力度。预算／竞价上调依据修改前后值判断。竞价调整比例覆盖广告位等适用调整项。</div></div><label class="label required">控制力度</label><div class="checks">${['页面提醒','飞书审批','禁止操作'].map(l=>`<label><input type="radio" name="level" ${draft.level===l?'checked':''} onchange="draft.level='${l}';preview()">${l}</label>`).join('')}<div class="hint wide">页面提醒：确认后继续；飞书审批：通过后执行；禁止操作：不允许提交。</div></div><label class="label required">店铺</label><div><input class="wide" value="${esc(draft.shops)}" placeholder="多个店铺用逗号分隔，如 US/topshoesUS, GB/dreampairsEU" oninput="draft.shops=this.value"><div class="hint">演示可输入店铺；正式页面沿用当前店铺多选。</div></div><label class="label">生效时间</label><div><input type="datetime-local" value="${esc(draft.start||'')}" onchange="draft.start=this.value"> 至 <input type="datetime-local" value="${esc(draft.end||'')}" onchange="draft.end=this.value"><div class="hint">不填表示长期生效；日期按所选店铺站点当地时间解释。可设置网一后8天等阶段窗口。</div></div><label class="label">操作来源</label><select onchange="draft.source=this.value">${options(['全部来源','页面手工操作','批量导入','自动化规则'],draft.source||'全部来源')}</select></div></div><div class="section"><h3>自定义范围 <span class="muted">同组条件为“且”，不同组为“或”</span></h3><div class="inner"><div id="groups"></div><button onclick="addGroup()">＋ 添加条件组（或）</button><div class="hint">不设置条件表示适用店铺内全部Style。标注“新增”的条件为扩展设计，需补充相应数据或比较能力。</div><div class="preview" id="preview"></div></div></div>`;$('editorBody').innerHTML=body;renderGroups();if(readonly)$('editorBody').querySelectorAll('input,select,button').forEach(x=>x.disabled=true)}
function changeAction(a,on){draft.actions=on?[...draft.actions,a]:draft.actions.filter(x=>x!==a);renderGroups()}
function renderGroups(){$('groups').innerHTML=draft.groups.map((g,i)=>`${i?'<div class="or">或</div>':''}<div class="group"><div class="grouphead"><b>条件组 ${i+1} <span class="muted">全部满足</span></b><button class="link" onclick="draft.groups.splice(${i},1);renderGroups()">删除条件组</button></div>${g.map((c,j)=>row(c,i,j)).join('')}<button class="link" onclick="addCondition(${i})">＋ 添加条件（且）</button></div>`).join('');preview()}
function row(c,i,j){let f=fields[c.field],path=`draft.groups[${i}][${j}]`,ops=f.type==='relation'?['目标定级低于实际定级','目标定级高于实际定级','目标定级等于实际定级']:f.type==='metric'||f.type==='number'?['≥','≤','>','<','=','≠','介于']:['包含','不包含'];let value=f.type==='relation'?'':f.values?`<input class="value" value="${esc(c.value)}" list="list-${i}-${j}" placeholder="选择或输入，多值用逗号分隔" oninput="${path}.value=this.value;preview()"><datalist id="list-${i}-${j}">${f.values.map(v=>`<option value="${esc(v)}">`).join('')}</datalist>`:c.op==='介于'?`<input type="number" style="width:105px" value="${esc(c.value)}" placeholder="最小值" oninput="${path}.value=this.value;preview()"><span>至</span><input type="number" style="width:105px" value="${esc(c.max||'')}" placeholder="最大值" oninput="${path}.max=this.value;preview()">`:`<input class="value" type="number" step="any" value="${esc(c.value)}" oninput="${path}.value=this.value;preview()">`;return `<div class="condition"><span class="and">${j?'且':''}</span><select class="field" onchange="changeField(${i},${j},this.value)">${Object.keys(fields).map(k=>`<option value="${esc(k)}" ${k===c.field?'selected':''}>${k}${fields[k].added?' · 新增':''}</option>`).join('')}</select>${f.windows?`<select class="window" onchange="${path}.window=this.value;preview()">${options(f.windows,c.window)}</select>`:''}<select class="op" style="${f.type==='relation'?'width:260px':''}" onchange="${path}.op=this.value;renderGroups()">${options(ops,c.op)}</select>${value}<span>${f.unit||''}</span><button class="link" aria-label="删除条件" onclick="draft.groups[${i}].splice(${j},1);renderGroups()">✕</button></div>${f.hint?`<div class="hint" style="margin-left:30px">${esc(f.hint)}</div>`:''}${f.actions&&!f.actions.some(a=>draft.actions.includes(a))?'<div class="hint" style="color:#e6a23c;margin-left:30px">请勾选与本条件对应的控制动作。</div>':''}`}
function changeField(i,j,k){let f=fields[k]||{};draft.groups[i][j]={field:k,op:!k?'':f.type==='single'?'':f.type==='relation'?'目标定级低于实际定级':f.ops?f.ops[0]:(f.type==='metric'||f.type==='number')?'≥':'包含',window:f.windows?.[0]||'',value:f.type==='single'?(f.values?.[0]??'是'):''};renderGroups()}
function addCondition(i){draft.groups[i].push({field:'CT',op:'包含',value:''});renderGroups()}
function addGroup(){draft.groups.push([{field:'Style定位',op:'包含',value:''}]);renderGroups()}
function preview(){if(!$('preview'))return;$('preview').innerHTML=`<b>规则预览</b><br>当操作为 ${esc(draft.actions.join(' / ')||'未选择')}，且满足 ${esc(draft.groups.map(g=>'（'+g.map(c=>c.op==='介于'?`${c.window||''}${c.field}介于${c.value}～${c.max||''}${fields[c.field].unit||''}`:c.field==='定级关系'?c.op:conditionText(c)).join(' 且 ')+'）').join(' 或 ')||'全部Style')} 时，执行 <b>${esc(draft.level)}</b>。`}
function saveRule(){let error='';if(!draft.name.trim())error='请填写名称';else if(rules.some(r=>r.id!==editing&&r.name===draft.name.trim()))error='名称已存在，请进行修改';else if(!draft.actions.length)error='请至少选择一项控制动作';else if(!draft.shops.trim())error='请填写适用店铺';else if(!!draft.start!==!!draft.end)error='请完整填写生效起止时间，或全部留空';else if(draft.start&&draft.start>=draft.end)error='结束时间必须晚于开始时间';for(let g of draft.groups){if(!g.length)error='空条件组请删除或补充条件';for(let c of g){let f=fields[c.field];if(!f){error='请完善自定义范围';break}if(f.type!=='relation'&&!String(c.value??'').trim())error='请完整填写条件值';if(c.op==='介于'&&(c.max===''||c.max==null||Number(c.max)<Number(c.value)))error='请检查区间上下限';if(f.integer&&!error){const vals=c.op==='介于'?[c.value,c.max]:[c.value];for(const raw of vals){const n=Number(raw);if(String(raw??'').trim()===''||!Number.isInteger(n)||(f.min!=null&&n<f.min)||(f.max!=null&&n>f.max)){error=`${c.field}需输入${f.min}-${f.max}之间的整数`;break}}}if(f.actions&&!f.actions.some(a=>draft.actions.includes(a)))error='动作相关条件与控制动作不匹配'}}if(error){$('error').textContent=error;return}let before=rules.find(r=>r.id===editing);draft.id=editing||Date.now();draft.name=draft.name.trim();draft.updated=new Date().toLocaleString('zh-CN');logs.unshift(`${before?'修改':'新增'}：${draft.name}\n操作前：${before?JSON.stringify(before,null,2):'无'}\n操作后：${JSON.stringify(draft,null,2)}`);if(editing)rules=rules.map(r=>r.id===editing?structuredClone(draft):r);else rules.unshift(structuredClone(draft));persist();closeRule();render()}
function closeRule(){$('overlay').style.display='none'}function notice(t,s){$('dialogTitle').textContent=t;$('dialogText').textContent=s;$('dialog').showModal()}function showLogs(){notice('操作日志（本次演示会话）',logs.join('\n\n')||'暂无操作记录')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rules,null,2)],{type:'application/json'}));a.download='风控规则配置.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').style.display==='block')closeRule()});render();

function picker(values,selected,onchange,cls=''){
const chosen=String(selected||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean),id='pick-'+Math.random().toString(36).slice(2);values=[...new Set([...values,...chosen])];
return '<div class="multi-wrap '+cls+'"><button type="button" class="multi-button" onclick="togglePicker(this.nextElementSibling.id)"><span>'+esc(chosen.join('、')||'请选择')+'</span><span>⌄</span></button><div class="multi-menu" id="'+id+'" hidden><input type="search" placeholder="搜索" oninput="this.parentElement.querySelectorAll(&quot;label&quot;).forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(this.value.toLowerCase()))">'+values.map(v=>'<label><input type="checkbox" value="'+esc(v)+'" '+(chosen.includes(v)?'checked':'')+' onchange="'+onchange+';updatePicker(this)">'+esc(v)+'</label>').join('')+'</div></div>';
}
function togglePicker(id){let el=$(id),next=el.hidden;document.querySelectorAll('.multi-menu').forEach(x=>x.hidden=true);el.hidden=!next}
function picked(el){return [...el.closest('.multi-menu').querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value).join(',')}
function updatePicker(el){el.closest('.multi-wrap').querySelector('.multi-button span').textContent=picked(el).split(',').join('、')||'请选择';preview()}
document.addEventListener('click',e=>{if(!e.target.closest('.multi-wrap'))document.querySelectorAll('.multi-menu').forEach(x=>x.hidden=true)});
const originalRow=row;
row=function(c,i,j){let html=originalRow(c,i,j);if(fields[c.field].values){html=html.replace(/<input class="value"[\s\S]*?<\/datalist>/,picker(fields[c.field].values,c.value,'draft.groups['+i+']['+j+'].value=picked(this)'))}return html};
const originalEditor=editor;
editor=function(){originalEditor();let input=[...$('editorBody').querySelectorAll('input')].find(x=>x.placeholder.startsWith('多个店铺'));if(input){let wrap=document.createElement('div');wrap.innerHTML=picker(['US/topshoesUS','GB/dreampairsEU','DE/dreampairsEU','FR/dreampairsEU','IT/dreampairsEU','ES/dreampairsEU'],draft.shops,'draft.shops=picked(this)','store-picker');input.replaceWith(wrap.firstElementChild)}$('editorBody').querySelectorAll('.hint').forEach(x=>{if(/演示可输入|新增数据条件|新增管控指标|新增能力|不预设正式排序|标注“新增”/.test(x.textContent))x.remove()});if(readonly)$('editorBody').querySelectorAll('input,select,button').forEach(x=>x.disabled=true)};

function filterModePicker(key,values){const id='filter-mode-'+key,cur=filterDraft[key];return '<div class="filter-mode-pick"><button type="button" class="filter-mode-btn" onclick="toggleFilterMenu(&#39;'+id+'&#39;)"><span>'+esc(cur)+'</span>'+filterDownSvg+'</button><div id="'+id+'" class="filter-mode-menu" hidden>'+values.map(v=>'<button type="button" class="'+(v===cur?'active':'')+'" onclick="setFilterMode(&#39;'+key+'&#39;,&#39;'+esc(v)+'&#39;)">'+esc(v)+'</button>').join('')+'</div></div>'}
function setFilterMode(key,value){filterDraft[key]=value;const menu=$('filter-mode-'+key);if(menu){menu.hidden=true;menu.previousElementSibling.firstElementChild.textContent=value;menu.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.textContent===value))}}

function setFilterChoice(key,value,on){filterDraft[key]=on?[...new Set([...filterDraft[key],value])]:filterDraft[key].filter(x=>x!==value);const btn=$('filter-'+key).previousElementSibling;btn.classList.toggle('filled',filterDraft[key].length>0);btn.firstElementChild.textContent=filterDraft[key].join('、')||({statuses:'状态',shops:'适用店铺',people:'请选择人员',actions:'控制动作'}[key])}
function renderFilters(){document.querySelector('main .filters').innerHTML='<div class="compound">'+filterModePicker('mode',['包含','等于'])+'<input id="query" placeholder="请输入名称" value="'+esc(filterDraft.names.length?'已输入 '+filterDraft.names.length+' 项':filterDraft.name)+'" oninput="filterDraft.name=this.value;filterDraft.names=[]" onkeydown="if(event.key===&#39;Enter&#39;)searchRules()"><button type="button" id="batchNameBtn" class="batch-name" onclick="openBatchNames()">...</button><div id="batchPopover" class="batch-popover" hidden><div class="batch-popover-title">批量查询</div><textarea id="batchInput" placeholder="精准搜索，1 行一个，最多 200 项"></textarea><div class="batch-popover-foot"><span class="muted" id="batchCounter">精准搜索，1 行一个，最多 200 项</span><div class="batch-popover-actions"><button type="button" onclick="closeBatchNames()">取消</button><button type="button" class="primary" onclick="applyBatchNames()">确认</button></div></div></div></div>'+filterPicker('statuses','状态',['启用','已暂停','逻辑归档'])+filterPicker('shops','适用店铺',storeChoices)+'<div class="filter-combo">'+filterModePicker('personKind',['创建人','修改人'])+filterPicker('people','请选择人员',[...new Set(['Dylan.Shi','Lulu.Xu','Levi',...rules.map(r=>r.creator),...rules.map(r=>r.updater)])])+'</div><div class="filter-date" '+(!filtersExpanded?'hidden':'')+'>'+filterModePicker('timeKind',['创建时间','更新时间'])+'<div class="date-range">'+filterCalSvg+'<input aria-label="开始日期" type="'+(filterDraft.start?'date':'text')+'" placeholder="开始日期" value="'+filterDraft.start+'" onfocus="this.type=&#39;date&#39;" onblur="if(!this.value)this.type=&#39;text&#39;" onchange="filterDraft.start=this.value"><span>-</span><input aria-label="结束日期" type="'+(filterDraft.end?'date':'text')+'" placeholder="结束日期" value="'+filterDraft.end+'" onfocus="this.type=&#39;date&#39;" onblur="if(!this.value)this.type=&#39;text&#39;" onchange="filterDraft.end=this.value"></div></div><div class="extra-action" '+(!filtersExpanded?'hidden':'')+'>'+filterPicker('actions','控制动作',allActions)+'</div><div class="filter-actions"><button onclick="resetFilter()">重置</button><button class="primary" onclick="searchRules()">搜索</button><button class="filter-toggle" aria-label="展开收起筛选" onclick="filtersExpanded=!filtersExpanded;renderFilters()">'+(filtersExpanded?filterUpSvg:filterDownSvg)+'</button></div>'}
function searchRules(){if(filterDraft.start&&filterDraft.end&&filterDraft.start>filterDraft.end)return notice('提示','开始日期不能晚于结束日期');appliedFilters=structuredClone(filterDraft);currentPage=1;selectedRules.clear();render()}
resetFilter=function(){filterDraft={mode:'包含',name:'',names:[],statuses:[],shops:[],personKind:'创建人',people:[],timeKind:'创建时间',start:'',end:'',actions:[]};appliedFilters=structuredClone(filterDraft);selectedRules.clear();currentPage=1;renderFilters();render()};
function filteredRules(){const f=appliedFilters;return rules.filter(r=>{let st=r.archived?'逻辑归档':r.enabled?'启用':'已暂停';if(f.statuses.length?!f.statuses.includes(st):r.archived)return false;if(f.names.length&&!f.names.includes(r.name))return false;if(!f.names.length&&f.name&&(f.mode==='等于'?r.name!==f.name:!r.name.includes(f.name)))return false;if(f.shops.length&&!f.shops.some(x=>r.shops.split(/[,，、]/).map(x=>x.trim()).includes(x)))return false;if(f.actions.length&&!f.actions.some(x=>r.actions.includes(x)))return false;if(f.people.length&&!f.people.includes(f.personKind==='创建人'?r.creator:r.updater))return false;let date=(f.timeKind==='创建时间'?r.createdAt:r.updatedAt||'').slice(0,10);return (!f.start||date>=f.start)&&(!f.end||date<=f.end)})}
render=function(){const list=filteredRules(),pages=Math.max(1,Math.ceil(list.length/pageSize));currentPage=Math.min(currentPage,pages);const visible=list.slice((currentPage-1)*pageSize,currentPage*pageSize);document.querySelector('main thead').innerHTML='<tr><th style="width:38px"><input type="checkbox" aria-label="全选当前页" '+(visible.length&&visible.every(r=>selectedRules.has(r.id))?'checked':'')+' onchange="selectPage(this.checked)"></th><th style="width:66px">状态</th><th style="width:150px">名称</th><th style="width:78px">控制力度</th><th style="width:110px">店铺</th><th style="width:170px">自定义范围</th><th style="width:145px">控制动作</th><th style="width:80px">创建人</th><th style="width:140px">创建时间</th><th style="width:80px">更新人</th><th style="width:140px">更新时间</th><th style="width:145px">操作</th></tr>';$('rows').innerHTML=visible.map(r=>'<tr><td><input class="pick" type="checkbox" value="'+r.id+'" '+(selectedRules.has(r.id)?'checked':'')+' onchange="this.checked?selectedRules.add('+r.id+'):selectedRules.delete('+r.id+')"></td><td>'+(r.archived?'<span class="muted">逻辑归档</span>':'<button aria-label="'+(r.enabled?'暂停':'启用')+'规则" class="switch '+(r.enabled?'':'off')+'" onclick="requestState(&#39;'+(r.enabled?'暂停':'启用')+'&#39;,['+r.id+'])"></button>')+'</td><td title="'+esc(r.name)+'">'+esc(r.name)+'</td><td>'+esc(r.level)+'</td><td title="'+esc(r.shops)+'">'+esc(r.shops)+'</td><td class="rule" title="'+esc(summary(r))+'">'+esc(summary(r))+'</td><td title="'+esc(r.actions.join('、'))+'">'+esc(r.actions.join('、'))+'</td><td>'+esc(r.creator)+'</td><td>'+esc(r.createdAt)+'</td><td>'+esc(r.updater)+'</td><td>'+esc(r.updatedAt)+'</td><td><button class="link" onclick="openRule('+r.id+')">编辑</button><button class="link" onclick="openRule('+r.id+',true)">复制</button><button class="link" onclick="openRule('+r.id+',false,true)">查看</button><button class="link" aria-label="更多操作" onclick="showRowMenu(this,'+r.id+')">'+filterDownSvg+'</button></td></tr>').join('')||'<tr><td colspan="12" class="empty">暂无数据</td></tr>';$('count').textContent='共 '+list.length+' 条';document.querySelector('.foot').lastElementChild.outerHTML='<div class="pagination"><button '+(currentPage===1?'disabled':'')+' onclick="currentPage--;render()">〈</button><span style="color:#409eff">'+currentPage+'</span><button '+(currentPage===pages?'disabled':'')+' onclick="currentPage++;render()">〉</button><select aria-label="每页条数" onchange="pageSize=Number(this.value);currentPage=1;render()">'+[20,50,100,200].map(n=>'<option value="'+n+'" '+(n===pageSize?'selected':'')+'>'+n+'条/页</option>').join('')+'</select></div>'};
function selectPage(on){filteredRules().slice((currentPage-1)*pageSize,currentPage*pageSize).forEach(r=>on?selectedRules.add(r.id):selectedRules.delete(r.id));render()}
function openBatchNames(){const p=$('batchPopover');if(!p)return;const wasOpen=!p.hidden;document.querySelectorAll('.filter-options,.filter-mode-menu,.status-dropdown,.batch-popover').forEach(x=>x.hidden=true);if(wasOpen)return;$('batchInput').value=filterDraft.names.join('\n')||filterDraft.name;$('batchCounter').textContent='精准搜索，1 行一个，最多 200 项';$('batchCounter').style.color='';const btn=$('batchNameBtn');if(btn&&btn.offsetParent)p.style.setProperty('--arrow-left',Math.max(12,btn.offsetLeft+btn.offsetWidth/2-6)+'px');p.hidden=false;$('batchInput').focus?.()}
function closeBatchNames(){const p=$('batchPopover');if(p)p.hidden=true}
function applyBatchNames(){let names=[...new Set($('batchInput').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];if(names.length>200){$('batchCounter').textContent='最多支持200项，当前 '+names.length+' 项';$('batchCounter').style.color='#f56c6c';return}filterDraft.names=names;filterDraft.name='';filterDraft.mode='等于';closeBatchNames();renderFilters()}
function stateDropdown(){toggleFilterMenu('statusMenu')}
function requestState(action,ids=[...selectedRules]){document.querySelectorAll('.status-dropdown').forEach(x=>x.hidden=true);if(!ids.length)return notice('提示','请先选择需要操作的规则');const d=$('actionDialog');d.innerHTML='<h3>提示</h3><div class="modal-message">确定'+esc(action)+'所选的 '+ids.length+' 条规则吗？'+(action==='删除'?'<div class="hint">删除后规则不再生效，数据按逻辑归档保留。</div>':'')+'</div><div class="dialog-actions"><button onclick="this.closest(&#39;dialog&#39;).close()">取消</button><button class="primary" id="confirmState">确定</button></div>';$('confirmState').onclick=()=>{const now=new Date().toLocaleString('sv-SE');rules.filter(r=>ids.includes(r.id)).forEach(r=>{if(action==='删除'){r.archived=true;r.enabled=false}else{r.archived=false;r.enabled=action==='启用'}r.updater='Dylan.Shi';r.updatedAt=now;logs.unshift(now+' '+action+'：'+r.name)});persist();selectedRules.clear();d.close();render()};d.showModal()}
function showRowMenu(btn,id){const old=$('rowMenu');if(old)old.remove();const el=document.createElement('div');el.id='rowMenu';el.className='status-dropdown';el.style.position='fixed';const rect=btn.getBoundingClientRect();el.style.top=rect.bottom+'px';el.style.left=Math.min(rect.left,innerWidth-130)+'px';el.innerHTML='<button onclick="requestState(\&#39;删除\&#39;,['+id+']);this.parentElement.remove()">删除</button><button onclick="notice(\&#39;规则操作日志\&#39;,logs.filter(x=>x.includes(rules.find(r=>r.id==='+id+').name)).join(\&#39;\n\&#39;)||\&#39;暂无操作记录\&#39;);this.parentElement.remove()">操作日志</button>';document.body.append(el)}
document.querySelector('main .toolbar').innerHTML='<div class="toolbar-left"><button class="primary" onclick="openRule()">添加</button><div class="status-wrap"><button onclick="stateDropdown()">修改状态 '+filterDownSvg+'</button><div class="status-dropdown" id="statusMenu" hidden><button onclick="requestState(\&#39;启用\&#39;)">启用</button><button onclick="requestState(\&#39;暂停\&#39;)">暂停</button><button onclick="requestState(\&#39;删除\&#39;)">删除</button></div></div></div><button onclick="showLogs()">操作日志</button>';
const actionDialog=document.createElement('dialog');actionDialog.id='actionDialog';document.body.append(actionDialog);document.addEventListener('click',e=>{if(!e.target.closest('.filter-pick,.filter-mode-pick,.status-wrap,.status-dropdown,.compound'))document.querySelectorAll('.filter-options,.filter-mode-menu,.status-dropdown,.batch-popover').forEach(x=>x.hidden=true)});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBatchNames()});
const saveWithMetadata=saveRule;saveRule=function(){const old=editing?rules.find(r=>r.id===editing):null;if(draft){draft.creator=old?.creator||'Dylan.Shi';draft.createdAt=old?.createdAt||new Date().toLocaleString('sv-SE');draft.updater='Dylan.Shi';draft.updatedAt=new Date().toLocaleString('sv-SE')}saveWithMetadata()};
renderFilters();render();

// 列表入口在新标签页打开配置，配置页按地址恢复对应规则。
const openRuleInCurrentDocument=openRule;
openRule=function(id,copy=false,view=false){const target=new URL(location.href);target.hash=(view?'view':copy?'copy':id?'edit':'new')+(id?'-'+id:'');window.open(target.href,'_blank','noopener')};
const returnToRiskList=closeRule;
closeRule=function(){if(location.hash.match(/^#(new|edit|copy|view)/)){window.close();if(!window.closed)returnToRiskList()}else returnToRiskList()};
// 其他标签页保存或修改状态后，列表同步本地数据并保留筛选条件。
window.addEventListener('storage',e=>{if(e.key!=='ads-risk-action-prototype-v1'||!e.newValue)return;try{rules=JSON.parse(e.newValue);if(!document.body.classList.contains('rule-page'))render()}catch{}});

rules.forEach(r=>{r.actions=r.actions.map(a=>a==='提高竞价调整比例'?'提高广告位竞价比例':a);r.groups.forEach(g=>g.forEach(c=>{if(c.field==='本次竞价调整比例增量')c.field='广告位提交比例'}))});
const editorWithoutReminders=editor;editor=function(){editorWithoutReminders();$('editorBody').querySelectorAll('.hint').forEach(el=>el.remove())};
renderFilters();render();

rules.forEach(r=>{r.actions=[...new Set(r.actions.map(a=>['提高广告组默认竞价','提高投放竞价'].includes(a)?'提高默认竞价/投放竞价/基准竞价':a))]});
persist();renderFilters();render();

fields['']={};
function screenCondition(c,i,j){const f=fields[c.field]||{},path='draft.groups['+i+']['+j+']',numeric=f.type==='metric'||f.type==='number',ops=f.ops?f.ops:f.type==='relation'?['目标定级低于实际定级','目标定级高于实际定级','目标定级等于实际定级']:numeric?['≥','≤','>','<','=','≠','介于']:['包含','不包含'],numAttrs=(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':'')+' step="'+(f.integer?'1':'any')+'"';let val='',trailingUnit=f.unit||'';
if(!c.field)val='<input placeholder="请选择" disabled>';
else if(f.type==='relation')val='';
else if(f.type==='single')val='<select aria-label="条件值" onchange="'+path+'.value=this.value">'+options(f.values,c.value||f.values[0])+'</select>';
else if(f.values)val=picker(f.values,c.value,path+'.value=picked(this)');
else if(c.op==='介于'){const u=f.unit==='%'?'<span class="screen-unit">%</span>':'';if(f.unit==='%')trailingUnit='';val='<div style="display:flex;align-items:center;gap:8px"><input type="number"'+numAttrs+' placeholder="最小值" value="'+esc(c.value)+'" oninput="'+path+'.value=this.value">'+u+'<span>至</span><input type="number"'+numAttrs+' placeholder="最大值" value="'+esc(c.max||'')+'" oninput="'+path+'.max=this.value">'+u+'</div>'}
else val='<input type="number"'+numAttrs+' placeholder="'+(f.min!=null&&f.max!=null?'请输入'+f.min+'-'+f.max:'请输入')+'" value="'+esc(c.value)+'" oninput="'+path+'.value=this.value">';
return '<div class="screen-condition-row"><select class="field" aria-label="字段指标" onchange="changeField('+i+','+j+',this.value)"><option value="">字段指标</option>'+Object.keys(fields).filter(Boolean).map(k=>'<option value="'+esc(k)+'" '+(c.field===k?'selected':'')+'>'+esc(k)+'</option>').join('')+'</select>'+ (f.windows?'<select class="window" aria-label="时间窗口" onchange="'+path+'.window=this.value">'+options(f.windows,c.window)+'</select>':'')+(f.type==='single'?'':'<select class="op" aria-label="判断条件" '+(!c.field?'disabled':'')+' onchange="'+path+'.op=this.value;renderGroups()">'+(!c.field?'<option>判断条件</option>':options(ops,c.op))+'</select>')+'<div class="screen-value">'+val+'</div>'+(trailingUnit?'<span class="screen-unit">'+trailingUnit+'</span>':'')+'<button class="remove-condition" aria-label="删除条件" onclick="draft.groups['+i+'].splice('+j+',1);renderGroups()">×</button></div>';
}
renderGroups=function(){if(!$('groups'))return;$('groups').innerHTML=draft.groups.map((g,i)=>(i?'<div class="screen-or">或</div>':'')+'<div class="screen-condition-group">'+g.map((c,j)=>screenCondition(c,i,j)).join('')+'<div class="screen-group-actions"><button class="add-condition" aria-label="添加条件" onclick="addCondition('+i+')">＋</button><button class="delete-group" onclick="draft.groups.splice('+i+',1);renderGroups()">删除条件组</button></div></div>').join('');if(readonly)$('groups').querySelectorAll('input,select,button').forEach(el=>el.disabled=true)};
addCondition=function(i){draft.groups[i].push({field:'',op:'',value:''});renderGroups()};
addGroup=function(){draft.groups.push([{field:'',op:'',value:''}]);renderGroups()};
function changeShopScope(scope){draft.shopScope=scope;if(scope==='all')draft.shops='所有店铺';else if(draft.shops==='所有店铺')draft.shops='';renderShopScope()}
function renderShopScope(){const target=$('screenShopPicker');if(!target)return;target.innerHTML=draft.shopScope==='all'?'':picker(storeChoices,draft.shops,'draft.shops=picked(this)','store-picker');if(readonly)target.querySelectorAll('input,button').forEach(el=>el.disabled=true)}
editor=function(){draft.shopScope??=(draft.shops&&draft.shops!=='所有店铺'?'selected':'all');if(draft.shopScope==='all')draft.shops='所有店铺';
$('editorBody').innerHTML='<section class="screen-section"><h3 class="screen-title">基础信息</h3><div class="screen-field"><label class="screen-label required" for="ruleName">名称</label><input class="screen-input" id="ruleName" placeholder="请输入风控模板名称" value="'+esc(draft.name)+'" oninput="draft.name=this.value"></div><div class="screen-field"><label class="screen-label required">风控等级</label><div class="screen-radio">'+['页面提醒','飞书审批','禁止操作'].map(l=>'<label><input type="radio" name="level" '+(draft.level===l?'checked':'')+' value="'+l+'" onchange="draft.level=this.value">'+l+'</label>').join('')+'</div></div><div class="screen-field"><label class="screen-label required">控制动作</label><div class="action-options">'+Object.entries(actionGroups).map(([g,arr])=>'<div class="actiongroup"><span>'+esc(g)+'</span><div class="checks">'+arr.map(a=>'<label><input type="checkbox" value="'+esc(a)+'" '+(draft.actions.includes(a)?'checked':'')+' onchange="changeAction(this.value,this.checked)">'+esc(a)+'</label>').join('')+'</div></div>').join('')+'</div></div></section><section class="screen-section"><h3 class="screen-title">管控规则</h3><div class="screen-field"><label class="screen-label required">店铺</label><div class="screen-radio"><label><input type="radio" name="shopScope" value="all" '+(draft.shopScope==='all'?'checked':'')+' onchange="changeShopScope(this.value)">所有店铺</label><label><input type="radio" name="shopScope" value="selected" '+(draft.shopScope==='selected'?'checked':'')+' onchange="changeShopScope(this.value)">选择店铺</label></div><div class="screen-shops" id="screenShopPicker"></div></div><div class="screen-field"><label class="screen-label required">自定义范围</label><div id="groups"></div><button class="add-screen-group" onclick="addGroup()">添加条件组</button></div></section>';
renderShopScope();renderGroups();if(readonly)$('editorBody').querySelectorAll('input,select,button').forEach(el=>el.disabled=true)};
const saveScreenshotForm=saveRule;saveRule=function(){if(draft.groups.some(g=>!g.length||g.some(c=>!c.field))){$('error').textContent='请完善自定义范围';return}saveScreenshotForm()};
if(draft){if(!editing&&!draft.name)draft.groups=[[{field:'',op:'',value:''}]];editor()}

const riskFieldRename={'总转化率':'Style转化率','Style ROAS':'StyleROAS','ROAS':'StyleROAS','ACOS':'StyleACOS','广告点击率':'Style广告点击率','广告转化率':'Style广告转化率','点击成本':'Style点击成本','转化成本':'Style转化成本'};
const normalizeRiskGroups=(groups,keepEmptyRow=false)=>{(groups||[]).forEach(g=>g.forEach(c=>{if(riskFieldRename[c.field])c.field=riskFieldRename[c.field];const f=fields[c.field];if(!f){if(c.field){c.field='';c.op='';c.value='';delete c.max;delete c.window}return}if(f.type==='single'){c.op='';if(!['是','否'].includes(c.value))c.value='是'}else if(f.ops){const opMap={'≥':'>=','≤':'=<'};if(opMap[c.op])c.op=opMap[c.op];if(!f.ops.includes(c.op))c.op=f.ops[0]}if(f.windows&&!f.windows.includes(c.window))c.window=f.windows[0]}));return keepEmptyRow?groups:(groups||[]).map(g=>g.filter(c=>fields[c.field])).filter(g=>g.length)};
rules.forEach(r=>{r.groups=normalizeRiskGroups(r.groups,false)});persist();render();
if(draft){draft.groups=normalizeRiskGroups(draft.groups,true);editor()}
</script></body></html>
